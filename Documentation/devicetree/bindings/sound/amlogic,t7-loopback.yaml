%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,t7-loopback.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 microphone and playback reference combiner

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description: |
  The loopback engines concatenate selected microphone and playback reference
  channels. TDMIN LB performs reference deserialization; ASRC B optionally
  converts it to the microphone sample clock. Neither block is owned by the
  combiner. Loopback A and B feed TODDR sources 7 and 9 respectively.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: amlogic,t7-loopback

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: pclk

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - power-domains
  - '#sound-dai-cells'

unevaluatedProperties: false
