%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,t7-asrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 asynchronous sample rate converter

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description: |
  ASRC A receives one of the digital audio sources and feeds TODDR source 13.
  ASRC B receives TDMIN loopback and converts it to 16 kHz for loopback A.
  The coefficient SRAM ports belong to the engine, while channel sync uses
  a separate register in the audio bus. Both are owned by this component.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - amlogic,t7-asrc-a
      - amlogic,t7-asrc-b

  reg:
    items:
      - description: Engine and coefficient SRAM ports
      - description: Channel synchronizer control

  reg-names:
    items:
      - const: engine
      - const: chsync

  clocks:
    items:
      - description: Peripheral bus gate
      - description: Output reference MCLK
      - description: Engine clock derived from reference MCLK

  clock-names:
    items:
      - const: pclk
      - const: mclk
      - const: clk

  power-domains:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - power-domains
  - '#sound-dai-cells'

unevaluatedProperties: false
