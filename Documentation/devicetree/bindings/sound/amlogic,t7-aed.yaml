%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,t7-aed.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 stereo audio effects engine

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: amlogic,t7-aed
  reg:
    maxItems: 1
  clocks:
    items:
      - description: Peripheral gate
      - description: Processing clock
  clock-names:
    items:
      - const: pclk
      - const: clk
  power-domains:
    maxItems: 1
  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains
  - '#sound-dai-cells'

unevaluatedProperties: false
