%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/amlogic,t7-crg-udc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 Corigine USB device controller

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description:
  Peripheral controller beneath the T7 USB glue. The parent controls the
  PHYs, resets and power domain and must select peripheral mode.

properties:
  compatible:
    const: amlogic,t7-crg-udc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: core

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@fdd00000 {
        compatible = "amlogic,t7-crg-udc";
        reg = <0xfdd00000 0x100000>;
        interrupts = <GIC_SPI 131 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clkc 0>;
        clock-names = "core";
    };
