%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,t7-jpeg-encoder.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 HCODEC JPEG encoder

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description:
  The HCODEC block encodes JPEG images from linear YUV buffers. Its firmware
  is loaded through the platform secure monitor.

properties:
  compatible:
    const: amlogic,t7-jpeg-encoder

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: pclk
      - const: apb
      - const: core

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    jpeg-encoder@fe320000 {
        compatible = "amlogic,t7-jpeg-encoder";
        reg = <0xfe320000 0x10000>;
        interrupts = <GIC_SPI 93 IRQ_TYPE_EDGE_RISING>;
        clocks = <&clkc 0>, <&clkc 1>, <&clkc 2>;
        clock-names = "pclk", "apb", "core";
        power-domains = <&pwrc 0>;
    };
