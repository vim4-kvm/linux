%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,t7-vdin-test.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 exclusive VDIN snapshot experiment

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description: |
  Temporary experimental capture node owning the whole VPU register window.
  The display VPU node must remain disabled. This binding is restricted to the
  dedicated receiver test DTB, pending a shared VPU and V4L2 capture integration.

properties:
  compatible:
    const: amlogic,t7-vdin-test
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
    description: VDIN0 memory write completion
  power-domains:
    items:
      - description: VPU HDMI power island
      - description: VI CLK1 power island
      - description: VI CLK2 power island
  clocks:
    maxItems: 5
  clock-names:
    items:
      - const: pclk
      - const: vpu
      - const: vapb
      - const: clkb
      - const: measure
  amlogic,receiver:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HDMI receiver supplying the progressive 1080p60 signal

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - clocks
  - clock-names
  - amlogic,receiver

additionalProperties: false
