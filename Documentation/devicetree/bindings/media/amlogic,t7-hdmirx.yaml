%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,t7-hdmirx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 HDMI receiver

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description: |
  The receiver TOP window contains input 5V/HPD controls and per-port EDID RAM.
  The APB and receiver system gates are separate clocks; both are required for
  access to the DDC controller.
  A separate analog window contains the receiver PHY and input PLL.

properties:
  compatible:
    const: amlogic,t7-hdmirx

  reg:
    minItems: 3
    items:
      - description: Receiver TOP controls and EDID RAM
      - description: Analog PHY and input PLL
      - description: Byte-addressed receiver core and timing detector
      - description: Optional stereo FRHDMIRX input FIFO

  reg-names:
    minItems: 3
    items:
      - const: top
      - const: phy
      - const: cor
      - const: frhdmirx

  clocks:
    minItems: 6
    maxItems: 9

  clock-names:
    minItems: 6
    items:
      - const: pclk
      - const: sys
      - const: cfg
      - const: meter
      - const: 2m
      - const: 5m
      - const: audio-pll
      - const: frhdmirx
      - const: acr

  "#sound-dai-cells":
    const: 0

  power-domains:
    maxItems: 1

  amlogic,input-port:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Physical receiver input port to monitor.
    enum: [0, 1, 2]

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - power-domains
  - amlogic,input-port

allOf:
  - if:
      required: ["#sound-dai-cells"]
    then:
      properties:
        reg:
          minItems: 4
        reg-names:
          minItems: 4
        clocks:
          minItems: 9
        clock-names:
          minItems: 9
    else:
      properties:
        reg:
          maxItems: 3
        reg-names:
          maxItems: 3
        clocks:
          maxItems: 6
        clock-names:
          maxItems: 6

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/amlogic,t7-peripherals-clkc.h>
    #include <dt-bindings/power/amlogic,t7-pwrc.h>

    hdmi-receiver@fe398000 {
        compatible = "amlogic,t7-hdmirx";
        reg = <0xfe398000 0x4000>, <0xfe39c000 0x50>,
              <0xfe3a0000 0x8000>;
        reg-names = "top", "phy", "cor";
        power-domains = <&pwrc PWRC_T7_HDMIRX_ID>;
        clocks = <&clkc_periphs CLKID_SYS_HDMIRX_PCLK>,
                 <&clkc_periphs CLKID_SYS_HDMIRX>,
                 <&clkc_periphs CLKID_HDMIRX_CFG>,
                 <&clkc_periphs CLKID_HDMIRX_METER>,
                 <&clkc_periphs CLKID_HDMIRX_2M>,
                 <&clkc_periphs CLKID_HDMIRX_5M>;
        clock-names = "pclk", "sys", "cfg", "meter", "2m", "5m";
        amlogic,input-port = <1>;
    };
