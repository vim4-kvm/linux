%YAML 1.2
---
$id: http://devicetree.org/schemas/media/cec/amlogic,t7-ao-cec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 AO CEC A controller

maintainers:
  - localhost-copilot <318096335+localhost-copilot@users.noreply.github.com>

description: |
  The T7 CECA controller has the Meson AO CEC command interface, external
  peripheral clocks and a system clock filter. CECB can redirect its output
  onto the CECA pad. The CECA driver owns the CECB routing word to prevent
  concurrent use of that controller on the same physical wire.

allOf:
  - $ref: cec-common.yaml#

properties:
  compatible:
    const: amlogic,t7-ao-cec

  reg:
    items:
      - description: CECA controller registers
      - description: CECB general control and pad routing register

  reg-names:
    items:
      - const: core
      - const: cecb-route

  clocks:
    items:
      - description: CECA 32768 Hz clock
      - description: CEC peripheral register clock

  clock-names:
    items:
      - const: core
      - const: pclk

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts
  - hdmi-phandle

unevaluatedProperties: false

examples:
  - |
    cec@fe044000 {
        compatible = "amlogic,t7-ao-cec";
        reg = <0xfe044000 0x14>, <0xfe044040 0x4>;
        reg-names = "core", "cecb-route";
        clocks = <&clkc 9>, <&clkc 149>;
        clock-names = "core", "pclk";
        interrupts = <179>;
        hdmi-phandle = <&hdmi_tx>;
    };
