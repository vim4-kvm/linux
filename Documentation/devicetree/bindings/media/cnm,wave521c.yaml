%YAML 1.2
---
$id: http://devicetree.org/schemas/media/cnm,wave521c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chips&Media Wave 5 Series multi-standard codec IP

maintainers:
  - Nas Chung <nas.chung@chipsnmedia.com>
  - Jackson Lee <jackson.lee@chipsnmedia.com>

description:
  The Chips&Media WAVE codec IP is a multi format video encoder/decoder

properties:
  compatible:
    oneOf:
      - items:
          - const: ti,j721s2-wave521c
          - const: cnm,wave521c
      - const: amlogic,t7-wave521c

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 5

  clock-names:
    minItems: 1
    maxItems: 5

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  sram:
    maxItems: 1
    description:
      The VPU uses the SRAM to store some of the reference data instead of
      storing it on DMA memory. It is mainly used for the purpose of reducing
      bandwidth.

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: amlogic,t7-wave521c
    then:
      properties:
        clocks:
          items:
            - description: DOS register clock
            - description: VPU APB clock
            - description: Wave AXI clock (A)
            - description: Wave bitstream processor clock (B)
            - description: Wave video codec clock (C)
        clock-names:
          items:
            - const: pclk
            - const: apb
            - const: axi
            - const: bpu
            - const: vce
      required:
        - clock-names
        - interrupts
        - power-domains
        - resets
    else:
      properties:
        clocks:
          items:
            - description: VCODEC clock
        clock-names: false

additionalProperties: false

examples:
  - |
    vpu: video-codec@12345678 {
        compatible = "ti,j721s2-wave521c", "cnm,wave521c";
        reg = <0x12345678 0x1000>;
        clocks = <&clks 42>;
        interrupts = <42>;
        sram = <&sram>;
    };
