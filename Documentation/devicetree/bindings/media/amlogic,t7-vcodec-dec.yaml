%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,t7-vcodec-dec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 VDEC Video Decoder

maintainers:
  - Zhentao Guo <zhentao.guo@amlogic.com>

description: |
  T7 VDEC uses DOS DBUS isolation and a secure power domain, without the S4
  DMC request register. This describes the VDEC engine only, not HEVC or
  HCODEC. The DOS mapping overlaps HCODEC, so both engines need a shared
  register owner before concurrent operation can be supported. Normal board
  device trees keep this node disabled pending decoder validation.

properties:
  compatible:
    const: amlogic,t7-vcodec-dec

  reg:
    maxItems: 1

  reg-names:
    const: dos

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 5

  clock-names:
    items:
      - const: vdec
      - const: clk_vdec_mux
      - const: sys-apb
      - const: a73-apb
      - const: vdec-p0

  power-domains:
    items:
      - description: VDEC core, with secure memory/isolation/reset control
      - description: NIC3 parent, held for DOS-top access before core power-on

  power-domain-names:
    items:
      - const: vdec
      - const: nic3

  amlogic,canvas:
    description: Canvas lookup table provider.
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - power-domain-names
  - amlogic,canvas

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/amlogic,t7-peripherals-clkc.h>
    #include <dt-bindings/power/amlogic,t7-pwrc.h>
    video-codec@fe320000 {
        compatible = "amlogic,t7-vcodec-dec";
        reg = <0xfe320000 0x10000>;
        reg-names = "dos";
        interrupts = <GIC_SPI 92 IRQ_TYPE_EDGE_RISING>;
        clocks = <&clkc_periphs CLKID_SYS_DOS>,
                 <&clkc_periphs CLKID_VDEC>,
                 <&clkc_periphs CLKID_SYS_PCLK_SYS_APB>,
                 <&clkc_periphs CLKID_SYS_A73PCLK_APB>,
                 <&clkc_periphs CLKID_VDEC_0>;
        clock-names = "vdec", "clk_vdec_mux", "sys-apb", "a73-apb", "vdec-p0";
        power-domains = <&pwrc PWRC_T7_DOS_VDEC_ID>,
                        <&pwrc PWRC_T7_NIC3_ID>;
        power-domain-names = "vdec", "nic3";
        amlogic,canvas = <&canvas>;
        status = "disabled";
    };
