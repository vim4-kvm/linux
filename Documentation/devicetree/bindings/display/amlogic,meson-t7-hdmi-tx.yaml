%YAML 1.2
---
$id: http://devicetree.org/schemas/display/amlogic,meson-t7-hdmi-tx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 HDMI 2.1 Transmitter

maintainers:
  - Igor Pecovnik <igor@armbian.com>

description: |
  The HDMI transmitter of the Amlogic T7 SoC. It is not a Synopsys DesignWare
  core. It has a TOP block with 32-bit registers and a COR block with 8-bit
  registers. The video encoder (VENC) of the VPU feeds it, see
  amlogic,meson-vpu.yaml. The HDMI PHY registers are in the analog control
  block, which the VPU node describes.

properties:
  compatible:
    const: amlogic,t7-hdmi-tx

  amlogic,boot-handoff:
    type: boolean
    description: |
      Fixed 1080p firmware handoff. Read TOP/COR through the firmware SMC ABI;
      do not reset or program TX, PHY, DDC, audio, or clocks. Only valid with
      the dedicated T7 display-handoff consumer, not normal meson modesetting.

  amlogic,boot-monitor:
    type: boolean
    description: |
      Extend boot-handoff with EDID reads and HPD polling. DDC writes are
      allowed, but video, PHY and PLL programming remain forbidden. With
      sound-dai-cells this also enables two-channel PCM audio for the fixed
      firmware timing. The connector supplies EDID-derived ELD to hdmi-codec.

  hpd-gpios:
    maxItems: 1
    description: GPIOW15, active high, for the physical HDMI sink presence.

  reg:
    items:
      - description: TOP registers
      - description: COR registers

  reg-names:
    items:
      - const: top
      - const: cor

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: APB bus clock

  clock-names:
    items:
      - const: pclk

  resets:
    items:
      - description: HDMI TX controller reset
      - description: HDMI TX PHY reset

  reset-names:
    items:
      - const: hdmitx
      - const: phy

  power-domains:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input from the VPU HDMI-TX port.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output to the HDMI connector.

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - ports

additionalProperties: false

allOf:
  - if:
      required:
        - amlogic,boot-monitor
    then:
      required:
        - amlogic,boot-handoff
        - hpd-gpios
  - if:
      required:
        - amlogic,boot-handoff
        - "#sound-dai-cells"
    then:
      required:
        - amlogic,boot-monitor
  - if:
      not:
        required:
          - amlogic,boot-handoff
    then:
      required:
        - hpd-gpios

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    hdmi-tx@fe300000 {
        compatible = "amlogic,t7-hdmi-tx";
        reg = <0xfe300000 0x10000>, <0xfe380000 0x10000>;
        reg-names = "top", "cor";
        interrupts = <GIC_SPI 204 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clkc_periphs 194>;
        clock-names = "pclk";
        resets = <&reset 29>, <&reset 22>;
        reset-names = "hdmitx", "phy";
        power-domains = <&pwrc 14>;
        #sound-dai-cells = <0>;
        hpd-gpios = <&gpio 55 0>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                hdmi_tx_in: endpoint {
                    remote-endpoint = <&vpu_hdmi_out>;
                };
            };

            port@1 {
                reg = <1>;

                hdmi_tx_out: endpoint {
                    remote-endpoint = <&hdmi_connector_in>;
                };
            };
        };
    };
