name: VIM4 kernel
on:
  push:
    branches: [vim4-kvm-5.15]
    tags: ['release-*']
  pull_request:
    branches: [vim4-kvm-5.15]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified kernel package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  kernel:
    uses: vim4-kvm/vim4-kvm/.github/workflows/kernel.yml@main
    permissions:
      contents: write
    with:
      repository: linux
      publish: ${{ startsWith(github.ref, 'refs/tags/release-') || inputs.publish == true }}
